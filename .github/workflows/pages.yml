name: pages

# Publishes site/ as the landing page, the example brand folder under /example/ and the screenshots under /screenshots/.
on:
  push:
    branches: [main]
    paths: [site/**, examples/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          set -eu
          mkdir -p _site
          cp -R site/. _site/
          cp -R examples/brand-studio/brand _site/example
          cp -R examples/brand-studio/screenshots _site/screenshots
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
