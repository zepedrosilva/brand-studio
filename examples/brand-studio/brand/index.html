<head>

<title>Brand design brief</title>
<style>
:root{color-scheme:light;--ink:#171717;--muted:#5f6368;--faint:#8a8f96;--line:#e5e7eb;--soft:#f6f7f8;--accent:#171717;--ok:#14532d;--ok-bg:#e8f5ec;--warn:#7a4b00;--warn-bg:#fdf3dc;--bad:#8c1d18;--bad-bg:#fdeceb;

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:#fff;color:var(--ink);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
h1,h2,h3,p,ul,ol,dl,figure{margin:0}
.topbar{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:0 max(16px,env(safe-area-inset-left,0px))}
.topbar-in{max-width:1180px;margin:0 auto;height:52px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.crumb{font:600 13px var(--sans);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb span{color:var(--faint);font-weight:500}
.live{display:flex;align-items:center;gap:8px;font:500 13px var(--sans);color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 0 rgba(22,163,74,.5);animation:pulse 1.8s infinite}
.dot.off{background:var(--faint);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}html{scroll-behavior:auto}}
.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:210px minmax(0,1fr);gap:56px;padding:0 max(16px,env(safe-area-inset-left,0px)) 96px}
nav.toc{position:sticky;top:52px;align-self:start;padding:36px 0;font-size:13.5px;max-height:calc(100vh - 52px);overflow:auto}
nav.toc p{font:600 11px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:0 0 10px}
nav.toc a{display:flex;gap:10px;padding:5px 0;color:var(--muted);text-decoration:none;border-left:2px solid transparent;padding-left:10px;margin-left:-12px}
nav.toc a b{font-weight:500;color:var(--faint);min-width:1.4em;font-variant-numeric:tabular-nums}
nav.toc a:hover{color:var(--ink)}
nav.toc a.on{color:var(--ink);border-left-color:var(--ink);font-weight:600}
nav.toc .gap{height:14px}
main{min-width:0;padding-top:48px}
.cover{display:grid;gap:22px;padding-bottom:44px;border-bottom:1px solid var(--line)}
.eyebrow{font:600 12px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{font:700 clamp(34px,5.4vw,56px)/1.04 var(--sans);letter-spacing:-.03em}
.coverrow{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.coverrow img.cm{width:96px;height:96px;object-fit:contain;flex:none}
.lede{font-size:18px;line-height:1.55;color:#2c2f33;max-width:60ch}
.facts{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.facts div{flex:1 1 150px;background:#fff;padding:14px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.facts dt{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.facts dd{margin:4px 0 0;font-size:14.5px;font-weight:500}
section.sec{padding:52px 0 8px}
section.sec>header{display:flex;align-items:baseline;gap:14px;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--line)}
section.sec>header .n{font:600 13px var(--mono);color:var(--faint)}
h2{font:650 26px/1.2 var(--sans);letter-spacing:-.02em}
h3{font:650 16px/1.3 var(--sans);margin:22px 0 8px}
.sub{font:600 11px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p+p{margin-top:12px}
.prose{max-width:66ch}.prose p{font-size:17px}
.note{font-size:13.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:12px;margin-top:14px;max-width:66ch}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;background:#fff}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border:1px solid var(--line);border-radius:99px;font-size:13.5px;font-weight:500;background:#fff}
.chip.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.statement{font:500 21px/1.45 var(--sans);letter-spacing:-.01em;max-width:62ch;padding:22px 24px;border:1px solid var(--line);border-radius:14px;background:var(--soft)}
.own{display:flex;align-items:baseline;gap:14px;margin-top:16px}.own b{font:700 34px var(--sans);letter-spacing:-.02em}.own span{color:var(--muted);font-size:14px}
.stage{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.panel{border-radius:14px;border:1px solid var(--line);min-height:210px;display:grid;place-items:center;padding:28px;position:relative}
.panel img{max-width:100%;height:150px;object-fit:contain}
.panel small{position:absolute;left:14px;bottom:10px;font:500 11.5px var(--sans);opacity:.7}
.sizes{display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap;padding:18px 20px}
.sizes figure{display:grid;gap:8px;justify-items:start}.sizes img{image-rendering:auto}.sizes figcaption{font-size:12px;color:var(--muted)}
.sw{display:grid;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sw .pair{display:grid;grid-template-columns:1fr 1fr;height:92px}
.sw .pair div{display:flex;align-items:flex-end;padding:8px 10px;font:500 11.5px var(--mono)}
.sw .meta{padding:12px 14px;font-size:13.5px;display:grid;gap:2px}.sw .meta b{font-size:15px}.sw .meta span{color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
thead th{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}.tw table td:first-child,.tw table th:first-child{padding-left:16px}.tw tr:last-child td{border-bottom:0}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.file{border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid}
.file .th{height:110px;display:grid;place-items:center;padding:14px;background:#fff}.file .th img{max-width:100%;max-height:82px}
.file .th.dk{background:#1d1d1f}.file .th.tl{background:var(--soft)}
.file div.t{padding:10px 12px;border-top:1px solid var(--line);font-size:13px;display:grid;gap:1px}.file div.t b{font:600 12.5px var(--mono);word-break:break-all}.file div.t span{color:var(--muted)}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.cc{border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto}
.cc.picked{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.cc .im{background:#fff;display:grid;place-items:center;padding:22px;border-bottom:1px solid var(--line)}.cc .im img{height:150px;max-width:100%;object-fit:contain}
.cc .bd{padding:14px 16px;display:grid;gap:6px;align-content:start}.cc .bd b{font-size:15px}.cc .bd p{font-size:13.5px;color:var(--muted)}
.cc .ft{padding:12px 16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cc .px{display:flex;gap:10px;align-items:center}.cc .px img{width:16px;height:16px;image-rendering:auto}
button,.btn{font:600 14px var(--sans);border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:9px 16px;cursor:pointer;text-decoration:none;display:inline-block}
button.ghost,.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
.ask{border:1.5px solid var(--ink);border-radius:14px;padding:18px 20px;display:grid;gap:12px;background:#fff;margin:0 0 28px}
.ask h3{margin:0}.ask .why{font-size:13.5px;color:var(--muted)}
.ask label{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer}.ask input[type=text]{font:400 15px var(--sans);padding:10px 12px;border:1px solid #c7cbd1;border-radius:8px;width:100%}
.tag{font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:#fff;border-radius:99px;padding:2px 9px}
.steps{list-style:none;padding:0;display:grid;gap:2px}
.steps li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;padding:8px 0;font-size:14.5px}
.steps .ic{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;color:#fff}
.steps .done .ic{background:#16a34a;border-color:#16a34a}.steps .active .ic{border-color:var(--ink);background:#fff}.steps .active .ic:after{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink);animation:pulse2 1.2s infinite}
@keyframes pulse2{50%{opacity:.25}}
.steps .pending{color:var(--faint)}.steps small{display:block;color:var(--muted)}
.md h1,.md h2,.md h3{font:650 17px/1.3 var(--sans);margin:22px 0 8px}.md h1{font-size:19px}.md p{font-size:15px;margin:8px 0}.md ul{margin:8px 0;padding-left:22px;font-size:15px}.md li{margin:3px 0}.md code{font:12.5px var(--mono);background:var(--soft);padding:1px 5px;border-radius:4px}.md hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.md .tw{margin:12px 0}
details{border:1px solid var(--line);border-radius:12px;padding:0 18px;margin-top:14px}
details>summary{cursor:pointer;padding:13px 0;font-weight:600;font-size:15px;list-style:none}details>summary::-webkit-details-marker{display:none}
details>summary:before{content:"+";display:inline-block;width:1.2em;color:var(--faint)}details[open]>summary:before{content:"–"}
details[open]{padding-bottom:14px}
.frame{width:100%;border:1px solid var(--line);border-radius:14px;height:2400px;background:#fff}
.legal{border:1px solid var(--warn-bg);background:#fffaf0;border-radius:12px;padding:6px 20px 14px}
.map{display:grid;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.map div{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:14px}.map div:last-child{border-bottom:0}
.map code{font:600 13px var(--mono)}.map .miss{color:var(--faint)}
footer.end{margin-top:72px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.empty{color:var(--faint);font-size:14px}
@media (max-width:920px){.shell{grid-template-columns:1fr;gap:0}nav.toc{display:none}main{padding-top:32px}.map div{grid-template-columns:1fr;gap:2px}}
@media print{.topbar,nav.toc,.ask,button,.btn{display:none!important}.shell{display:block;padding:0}section.sec{break-inside:auto;padding-top:28px}.card,.cc,.file,.sw,figure{break-inside:avoid}.frame{height:1500px}details{display:block}details>summary{display:none}details>*:not(summary){display:block}body{font-size:12.5pt}}
</style>

ory and set the word to own to \"checked\".\n\n**Verdict: pass with findings.** 0 MUST fail, 0 SHOULD fail [script].\n\n- Every fill in the brand SVGs, icons and exports is a roles-table value; the old brand colour appears in no asset [script].\n- brd:PAL-09: 21 of 21 pairs in the regenerated `applications.html` clear their floor [script]. The other colours on that page are its own chrome (pass and fail badges, a mock browser tab), not brand colours.\n- brd:CRF-01, CRF-02, CAP-02: the diamond and brackets stay distinct at 16 px and in one colour; the vermilion diamond reads on cream and on dark [render].\n- brd:CAP-03, CRF-03 on `social.svg`: outlined lettering on a tile, accepted as before.\n- Legal (brd:LGL-02): resemblance to common developer-tool bracket marks; no search was done; not a clearance.\n\nThe sections below are the earlier passes, kept as the record; colour values in them are updated where they described the current kit.\n\n---\n\n# Review: final kit\n\nReviewer: `brand-reviewer` (sonnet, high), on the whole brand folder after the kit. Written by the main session from the returned verdict, 2026-11-27.\n\n**Verdict: pass with findings.** 0 MUST fail, 0 SHOULD fail; 3 script `review` items, all resolved below.\n\nScope: 13 top-level SVGs (mark, mono, reversed, wordmark and reversed, four lockups, favicon, two app icons, social image), 6 icons and the export set. Scripts: brdcheck with `--brief`, `--exports` and `--icons`; brdinuse output read. Renders: resvg 0.50.0, about 25 PNGs looked at.\n\n## Passing MUST rules\n\n- brd:CTR-01 to CTR-05, CAP-01, SEC-01 on every file [script]. No text, tspan, image, href, style, script or gradient in any SVG or export.\n- brd:TYP-01, TYP-02 [script]: the wordmark is outlined; Space Grotesk 2.000, weight 700, OFL-1.1, source commit recorded.\n- brd:CRF-01, CRF-02 [render]: legible in one colour, inverted, and at 16 and 32 px; the 1 px channel at 16 px still reads.\n- brd:CTR-06 [script]: the export set is complete.\n- brd:PAL-01 to PAL-03, PAL-08, EVD-02 to EVD-04 [script]: every fill is a declared role value.\n\n## Findings\n\n- review brd:POS-05: the story is a draft until the maintainer confirms it (a user action, not a defect).\n- pass brd:PAL-09: 21 of 21 pairs in `applications.html` clear their floor. Thin margins: neutral #766E6A on #FDF3EF at 4.57:1 (12 px small print) and brand #D33222 on #FDF3EF at 4.53:1; re-run brdinuse after any change to those roles.\n- note brd:CAP-02: the channel is exactly 1 px at 16 px, at the limit; clean from 32 px up.\n- note brd:CRF-05: no known shape in mirror or rotation; the silhouette can read as an eye.\n- note brd:SET-01 to SET-03 [judgment only]: brdcheck did not run the set rules on `icons/`. All six icons share viewBox 24, stroke 2, square caps, mitre joins and no fill, matching `style-spec.json`. Logged as a plugin issue.\n- note brd:CNC-03 [judgment]: guesses at the final review were code brackets around a diamond, an eye, a gem in a frame: developer tooling reads, \"brand\" does not.\n\n## Review items resolved\n\n- brd:CAP-03 and brd:CRF-03 on `social.svg`: dismissed; the anchors and off-grid points are the outlined letters, exempt by design in wordmark and lockup files.\n- brd:CRF-01 on the mono render of an already reversed lockup: dismissed as a renderer artefact; the reversed display renders on dark read.\n- brd:CRF-02 on the horizontal lockup at 16 px: dismissed; its minimum is 120 px wide, and the 16 px asset is the mark.\n- brd:TYP-03, brd:CRF-06: confirmed clean; even letter spacing, no effects.\n\n## Legal (brd:LGL-01 to LGL-03, US only)\n\nWarnings, not decisions. AI-drafted, so copyright may not attach to the mark as drawn. Nobody has checked the mark or the name for trademark clearance: search the USPTO records, including the image search, before relying on it. Space Grotesk is OFL-1.1. Resemblance: generic code-bracket icons, and an eye. Only US notes exist; the brief's jurisdiction is worldwide.\n\n## Run notes\n\n- Two plugin issues found by this run: concept renders overwrite each other because every concept file is named `concept.svg`; and `brdcheck --icons` does not run the `SET-*` rules.\n\n---\n\n# Review: concepts at the checkpoint\n\nReviewer: `brand-reviewer` (sonnet, high), blind: given the three `concept.svg` files only, not the name, brief or notes. Written by the main session from the returned verdict, 2026-11-27.\n\n## Verdicts\n\n| Concept | Verdict |\n|---|---|\n| A (drafting compass) | incomplete after one edit round: brd:CRF-02 (MUST) is `review`; before the edit it was `fail` |\n| B (branding iron) | pass with findings |\n| C (code brackets) | pass with findings |\n\nScope: 3 files; brdcheck run (0 fail, 0 review; no brief, no font tools); renders run with resvg into `brand/renders/a`, `b`, `c`; check output `brand/checks/review.json`.\n\n## Name test (brd:CNC-03, judgment)\n\nGuesses from the renders alone, before any name was known; scored afterwards by the main session against the narrative.\n\n| Concept | Guesses | Score |\n|---|---|---|\n| A | compass or dividers drawing an arc; sickle or hook; clock hand or timer | partly (construction reads; the brand idea does not) |\n| B | plumb bob or pendulum; map pin or keyhole; key or hanging sign | no (no link to \"brand\" or to app identity) |\n| C | code brackets `\u003c\u003e`; eye; gem or data node | yes (the developer's world reads first) |\n\n## Findings\n\nA\n- fail brd:CRF-02 (MUST): the thin arc and tapering legs collapse at 16 px into a squiggle with no compass reading; weak at 32 px. Fix: thicken the arc and legs or add a small-size variant. [render]\n- fail brd:CAP-02 (SHOULD): the gap between the leg tip and the arc is about 0.5 px at 16 px and closes. [render]\n- note brd:CRF-04: weight lopsided to the upper right. brd:CRF-05: rotated 180 degrees it reads as a lightbulb or check mark.\n\nB\n- pass brd:CRF-01, brd:CRF-02 [render]\n- review brd:CRF-05 (SHOULD): upright it can read as a pin or key kit built by editing that pick. Every rule it applies has a number and a source.\n\nThe mark is a pair of code brackets holding one finished shape: the developer's world, framing the identity you leave with. The shape carries the only colour; the rest is ink, and a lowercase wordmark that sits comfortably next to code.\n\n## Concept\n\nTwo code brackets holding one finished shape: the developer's world framing the identity you leave with. The brackets run at 45 degrees and face inward around one solid diamond, built from three polygons on an 8-unit grid; the diamond's edges run parallel to the brackets, so the channel between them is the same width all round.\n\n## Positioning\n\n- Statement: for developers who build apps without a design background, brand-studio is a Claude Code plugin that drafts a full brand identity as checked SVG; unlike asking a model for a logo, every mark is checked against numbered, sourced rules before you see it (brd:POS-01)\n- Word to own: checked. The one word people should connect with the brand without being told; it steers the rationale and the copy\n- Distinctive assets: the vermilion diamond held inside two ink brackets, and the even channel between them; keep them unchanged in every file and every use (brd:POS-03)\n- Category colours: violet breaks (AI tools lean violet and violet-to-blue gradients); blue breaks (the default of developer tools); multicolour breaks (design tools). All three observations are assumed, not surveyed (brd:PAL-07)\n\n## Files\n\n| File | Use |\n|---|---|\n| `mark.svg` | Master, flat colours |\n| `mark-mono.svg` | One colour |\n| `mark-reversed.svg` | On dark backgrounds |\n| `wordmark.svg` | Outlined name |\n| `lockup-horizontal.svg` | Mark and name side by side |\n| `lockup-stacked.svg` | Mark above name |\n| `*-reversed.svg` | Wordmark and lockups for dark backgrounds |\n| `favicon.svg` | Browser tab |\n| `app-icon.svg`, `app-icon-dark.svg` | 1024 px square app icon, light and dark, no pre-rounded corners |\n| `social.svg` | 1200 by 630 social image: the horizontal lockup on the background colour |\n| `icons/` | Six interface icons and `style-spec.json` |\n\n## Downloads (brd:CTR-06)\n\n- Everything in one file: `exports/brand-studio-brand-assets.zip`\n- Vector: `exports/svg/` (one SVG per file above)\n- Raster: `exports/png/`, each file at 16, 32, 48, 64, 128, 256, 512 and 1024 px\n- Applications: `applications.html` shows the kit in a phone app, a browser tab, an app icon, a web page, a dark card, a slide and a flyer, with every colour pair measured\n- Transparency: every PNG has a transparent background, so it sits on any colour; only tiles (`app-icon*`, `social*`, `favicon*`, `*-tile*`) carry their own background. Use the reversed files on dark backgrounds.\n\n## Palette\n\n| Name | Hex | Role | Contrast against background (brd:EVD-02) |\n|---|---|---|---|\n| text | #2E2724 | mark (brackets) | 13.44:1 |\n| brand | #D33222 | mark (diamond) | 4.53:1 |\n| background | #FDF3EF | background | n/a |\n\n### Palette roles\n\n| Role | Light | Dark | Ramp | Contrast on background, light / dark (brd:EVD-02) |\n|---|---|---|---|---|\n| brand | #D33222 | #FE5F4B | vermilion 600/400 | 4.53:1 / 6.02:1 |\n| neutral | #766E6A | #A59C98 | stone 600/400 | 4.57:1 / 6.76:1 |\n| background | #FDF3EF | #1B1412 | stone 50/950 | n/a |\n| text | #2E2724 | #FDF3EF | stone 900/50 | 13.44:1 / 16.65:1 |\n\nRamps are built in OKLCH: vermilion at hue 30 and chroma 0.20, stone at hue 45 and chroma 0.012, so the neutral leans toward the brand hue. The brand values are solved at the lightest point that clears 4.5:1, so the colour is as bright as the contrast floor allows. A first pick, a darker burnt orange, was replaced at review because it read brown. The light neutral sits at lightness 0.545, between two ramp steps, because the step above it measured 4.44:1 and ratios are never rounded up.\n\nColour-blind check (brd:EVD-03, brd:EVD-04): n/a. There is no `brand-2` and no `status` rows, so no pair has to be told apart by colour alone; the brackets and the diamond also differ by 13.44:1 against 4.53:1 in lightness and by shape.\n\n| Pair | Contrast between them | Deutan | Protan | Tritan (review) |\n|---|---|---|---|---|\n| n/a | n/a | n/a | n/a | n/a |\n\nWhy this palette: breaks the category's violet and blue so the mark stands apart from AI and developer tools; a warm neutral keeps the accent the only saturated colour.\n\nDark set: `mark-reversed.svg`, `wordmark-reversed.svg`, both reversed lockups and `app-icon-dark.svg`, all in the dark role values.\n\n## Typography\n\nSpace Grotesk Version 2.000 (variable font, weight 700), OFL-1.1, licence read at github.com/google/fonts `ofl/spacegrotesk/OFL.txt`, commit 5026800, on 2026-11-27. The wordmark is outlined; the font is not needed to display it.\n\n- Families: one, Space Grotesk (brd:TYP-05)\n- Text sizes: none stated (brd:TYP-06)\n- Why this type: a grotesque with technical details that sits beside code without looking like a code font; bold lowercase for the wordmark, matching the mark's weight. Careful: one family, one weight. Rigorous: shaped, kerned outlines, not drawn letters. Honest: lowercase, the name written as it is typed. Practical: reads at small sizes on screen.\n\n## Clear space and minimum size\n\n- Clear space: one bracket width (the horizontal thickness of a bracket arm, 40 of the mark's 256 units) on every side.\n- Minimum size: mark 16 px; horizontal lockup 120 px wide; stacked lockup 80 px wide. The lockup minimums are an assumption from the renders, not a measured rule.\n\n## Misuse\n\n- Do not stretch, rotate, recolour outside the palette, add effects or outline the mark.\n- Do not set the name in live text in place of the wordmark.\n- Do not place the full-colour mark on a background that fails the contrast table; use the mono or reversed file.\n- Do not swap the colours of the brackets and the diamond: the diamond is the only accent.\n\n## Evidence\n\nChecks run: brdcheck 0.1.0, brdrender 0.1.0 with resvg 0.50.0, brdtext 0.1.0 with fontTools 4.68.0 and uharfbuzz 0.57.0, brdinuse 0.1.0. On `social.svg`, the anchor count (brd:CAP-03) and grid (brd:CRF-03) items come from the outlined letters, which the script exempts only in files named `wordmark*` or `lockup*`; resolved as expected for lettering. Latest review: `review.md`, verdict in that file.\n\n## Legal notes (brd:LGL-01)\n\nWarnings only, not legal advice. These notes cover the United States only; other jurisdictions were not researched. Sources and recheck dates: `brand-core/references/legal.md` in the brand-studio plugin.\n\n- **Copyright.** This identity was drafted with an AI model. In the US, the Copyright Office's view is that prompts alone do not make a person the author of the output; human selection, arrangement and changes may be protectable. The mark as drawn may not be protected by copyright. (US Copyright Office report on copyrightability, January 2025, and the Supreme Court's refusal to hear Thaler v. Perlmutter, March 2026; checked 2026-11-18, recheck 2027-03-01.)\n- **Trademark.** Nobody has checked whether this mark or name is clear to use or register. That is your job before you rely on it: search the USPTO trademark records, including its image search (a beta), and get a professional clearance search before filing. (USPTO image search beta, April 2026; checked 2026-11-18, recheck 2027-04-01.)\n- **Fonts.** Space Grotesk, OFL-1.1. OFL fonts may be used in logos; check the family's own licence file. (OFL FAQ 1.1-update8; checked 2026-11-18, recheck 2027-05-01.)\n- **Generators.** No hosted image or vector generator was used.\n- **Resemblance.** The reviewer noted that the mark resembles generic code-bracket icons, and the designer noted it can read as an eye (brd:LGL-02). Run the searches above.\n\n## Provenance (brd:LGL-04)\n\n- Narrative and brief: the narrative was written by the maintainer with Claude; the brief was drafted by Claude, with the audience and positioning confirmed by the maintainer.\n- Chosen concept: C (code brackets) of three, picked by the maintainer on the live page on 2026-11-27, after an independent blind review.\n- Human decisions after the pick: the maintainer rejected the first brand colour (it read brown) and chose vermilion from six measured options, approved a rewritten story after an editorial review, and replaced the suggested word to own, \"proven\", with \"checked\".\n- Human changes after the pick: none to the geometry. Colours, the wordmark, lockups, icons and extras were made by Claude as edits of the picked master; the maintainer reviews them before the kit is published.\n", "legal": "## Legal notes (brd:LGL-01)\n\nWarnings only, not legal advice. These notes cover the United States only; other jurisdictions were not researched. Sources and recheck dates: `brand-core/references/legal.md` in the brand-studio plugin.\n\n- **Copyright.** This identity was drafted with an AI model. In the US, the Copyright Office's view is that prompts alone do not make a person the author of the output; human selection, arrangement and changes may be protectable. The mark as drawn may not be protected by copyright. (US Copyright Office report on copyrightability, January 2025, and the Supreme Court's refusal to hear Thaler v. Perlmutter, March 2026; checked 2026-11-18, recheck 2027-03-01.)\n- **Trademark.** Nobody has checked whether this mark or name is clear to use or register. That is your job before you rely on it: search the USPTO trademark records, including its image search (a beta), and get a professional clearance search before filing. (USPTO image search beta, April 2026; checked 2026-11-18, recheck 2027-04-01.)\n- **Fonts.** Space Grotesk, OFL-1.1. OFL fonts may be used in logos; check the family's own licence file. (OFL FAQ 1.1-update8; checked 2026-11-18, recheck 2027-05-01.)\n- **Generators.** No hosted image or vector generator was used.\n- **Resemblance.** The reviewer noted that the mark resembles generic code-bracket icons, and the designer noted it can read as an eye (brd:LGL-02). Run the searches above.", "verdict": null, "applications": true, "folder": [{"path": "index.html", "what": "This page: the live view while the run lasts, the report afterwards", "exists": true}, {"path": "brief.md", "what": "The brief: narrative, declaration, shortlist, palette roles, rationale, story", "exists": true}, {"path": "brand-sheet.md", "what": "The brand sheet: story, positioning, palette, type, clear space, legal notes", "exists": true}, {"path": "review.md", "what": "The latest review verdict, with the earlier concept review below it", "exists": true}, {"path": "*.svg", "what": "The logo files: master mark, variants, wordmark and lockups (SVG, outlined, no live text)", "exists": true}, {"path": "wordmark.json", "what": "Record of the font and the outlining step", "exists": true}, {"path": "applications.html", "what": "The kit placed in everyday applications, every colour pair measured", "exists": true}, {"path": "concepts/", "what": "The three greyscale concepts, each with its notes and renders", "exists": true}, {"path": "exports/", "what": "The downloadable set: svg/, png/ (transparent), manifest.json and the zip", "exists": true}, {"path": "renders/", "what": "PNG renders the checks looked at", "exists": true}, {"path": "checks/", "what": "JSON output of brdcheck", "exists": true}, {"path": "live/", "what": "State of this page; safe to delete once the run is over", "exists": true}], "updated": "2026-11-27T13:02:48+0000", "version": "0.1.0"};

    if (/^\s*$/.test(l)){ i++; continue; }
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)$/))){ out += "<h" + m[1].length + ">" + inline(m[2]) + "</h" + m[1].length + ">"; i++; continue; }
    if (/^---+\s*$/.test(l)){ out += "<hr>"; i++; continue; }
    if (/^\s*\|/.test(l)){
      const rows = []; while (i < lines.length && /^\s*\|/.test(lines[i])){ rows.push(lines[i]); i++; }
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = cells(rows[0]); const body = rows.slice(2).map(cells);
      out += '<div class="tw"><table><thead><tr>' + head.map(c => "<th>" + inline(c) + "</th>").join("") + "</tr></thead><tbody>" +
        body.map(r => "<tr>" + r.map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>"; continue;
    }
    if (/^\s*[-*]\s+/.test(l)){
      let items = []; while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])){ items.push(lines[i].replace(/^\s*[-*]\s+/, "")); i++; }
      out += "<ul>" + items.map(x => "<li>" + inline(x) + "</li>").join("") + "</ul>"; continue;
    }
    let para = []; while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,4}\s|\s*\||\s*[-*]\s|---)/.test(lines[i])){ para.push(lines[i]); i++; }
    out += "<p>" + inline(para.join(" ")) + "</p>";
  }
  return '<div class="md">' + out + "</div>";
}
function mdSection(text, title){
  const m = String(text || "").match(new RegExp("^## " + title + "[^\\n]*\\n([\\s\\S]*?)(?=^## |$(?![\\s\\S]))", "m"));
  return m ? m[1].trim() : "";
}

async function send(id, value){
  try {
    const r = await fetch("/api/answer", {method: "POST", headers: {"Content-Type": "application/json", "X-Brd-Token": token || ""}, body: JSON.stringify({id, value})});
    if (!r.ok) throw new Error((await r.json()).error || r.status);
    poll();
  } catch (e) { alert("Could not send the answer: " + e.message); }
}
document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-q]"); if (!f) return; e.preventDefault();
  const id = f.dataset.q, r = f.querySelector("input[type=radio]:checked"), t = f.querySelector("input[type=text]");
  send(id, r ? r.value : t ? t.value : "");
});

function build(){
  const name = S.name || "Untitled brand", fin = done();

  const secs = [
    ["story", "Story", secStory()], ["positioning", "Positioning", secPositioning()], ["mark", "The mark", secMark()], ["colour", "Colour", secColour()],
    ["type", "Typography", secType()], ["files", "Logo files", secFiles()], ["rules", "Clear space and misuse", secRules()], ["applications", "Applications", secApplications()],
    ["quality", "Quality checks", secQuality()], ["downloads", "Downloads", secDownloads()], ["legal", "Legal notes", secLegal()]
  ].filter(s => s[2]);

  const facts = [["Scope", B().scope ? "Scope " + B().scope : ""], ["Audience", B().audience ? cap(B().audience.split(",")[0]) : ""], ["Tone", B().tone || ""],
    ["Typeface", (B()["wordmark-font"] || "").split(/ Version |,| \(/)[0]], ["Review", S.verdict || ""]].filter(f => f[1]);
  const m = markSrc();
  let h = '<header class="cover"><div class="eyebrow">Brand analysis · output of the brand-studio plugin · /brand-create</div><div class="coverrow">' +
    (m ? '<img class="cm" src="' + src(m) + '" alt="">' : "") + '<div><h1>Brand design brief</h1><p class="lede" style="margin-top:10px"><b>' + esc(name) + "</b>" + (fin && S.run && S.run.finished ? " · " + esc(fmtDate(S.run.finished)) : "") + "</p></div></div>" +
    '<p class="lede">' + (fin ? "A first-draft identity for " + esc(name) + " with the reasoning and the evidence behind it: who it is for, the idea in the mark, the palette and type, the files, and how it holds up in use. It is a strong draft, not a finished identity: review it with a designer before wide use."
      : "This brief is being written now. Sections appear as each step finishes, and questions for you show up at the top. Leave this tab open.") + "</p>" +
    (facts.length ? '<dl class="facts">' + facts.map(f => "<div><dt>" + esc(f[0]) + "</dt><dd>" + esc(f[1]) + "</dd></div>").join("") + "</dl>" : "") + "</header>";
  h += '<div id="askBox">' + askHtml() + "</div>";

  secs.forEach((s, i) => h += '<section class="sec" id="' + s[0] + '"><header><span class="n">' + String(i + 1).padStart(2, "0") + "</span><h2>" + s[1] + "</h2></header>" + s[2] + "</section>");
  apps.forEach((s, i) => h += '<section class="sec" id="' + s[0] + '"><header><span class="n">' + "ABC"[i] + "</span><h2>" + s[1] + "</h2></header>" + s[2] + "</section>");
  h += '<footer class="end">Made with the brand-studio plugin. The mark, the palette and the type are a first draft; nothing here has been cleared for trademark or copyright. See the legal notes' + (secs.some(s => s[0] === "legal") ? "" : " in the brand sheet") + ".</footer>";

function mountFrame(){
  const box = $("#appFrame"); if (!box || frameBuilt) return; frameBuilt = true;
  const f = document.createElement("iframe"); f.className = "frame"; f.title = "Applications"; f.loading = "lazy"; f.src = "applications.html?embed" + (ver ? "&v=" + encodeURIComponent(ver) : "");
  f.addEventListener("load", () => { try { const h = f.contentDocument.documentElement.scrollHeight; if (h > 300) f.style.height = (h + 8) + "px"; } catch (e) {} });
  box.appendChild(f);

let io = null;
function spy(){
  if (io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ document.querySelectorAll("#toc a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id)); } }), {rootMargin: "-20% 0px -70% 0px"});
  document.querySelectorAll("section.sec").forEach(s => io.observe(s));
}
function sig(o){ const c = Object.assign({}, o); delete c.updated; delete c.token; return JSON.stringify(c); }
let last = "";
function apply(next){
  if (next.token) token = next.token;
  const s = sig(next); if (s === last) return; last = s;
  const typing = document.activeElement && document.activeElement.closest && document.activeElement.closest("form.ask");
  ver = next.updated || ""; S = next;
  if (typing) return;  // do not rebuild while the user is typing an answer
  build();
}
async function poll(){
  try {
    const r = await fetch("/api/state", {cache: "no-store"}); if (!r.ok) throw new Error(r.status);
    connected = true; fails = 0; apply(await r.json());
  } catch (e) {
    if (++fails >= 3 && connected){ connected = false; build(); }
    else if (fails >= 3 && !connected) clearInterval(timer);  // a static host, not brdlive: stop asking
  }
